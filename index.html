
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Messages</title>
<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    background: #f2f2f7;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    height: 100vh;
    overflow: hidden;
    color: #111;
}

.app {
    max-width: 520px;
    height: 100dvh;
    margin: auto;
    background: #fff;
    display: flex;
    flex-direction: column;
    box-shadow: 0 0 30px #0001;
}

.header {
    height: 92px;
    flex-shrink: 0;
    padding: 12px 16px;
    padding-top: max(12px, env(safe-area-inset-top));
    border-bottom: 1px solid #ddd;
    display: flex;
    align-items: center;
    gap: 12px;
    background: #fafafa;
}

.back {
    color: #1685ed;
    font-size: 27px;
    cursor: pointer;
}

.group {
    flex: 1;
    text-align: center;
}

.avatars {
    display: flex;
    justify-content: center;
    margin-bottom: 3px;
}

.avatar {
    width: 27px;
    height: 27px;
    border-radius: 50%;
    border: 2px solid white;
    margin-left: -5px;
    display: grid;
    place-items: center;
    font-size: 13px;
    color: white;
    font-weight: 700;
}

.group-name {
    font-size: 13px;
    font-weight: 600;
}

.status {
    font-size: 10px;
    color: #888;
    margin-top: 2px;
}

.info {
    color: #1685ed;
    font-size: 23px;
    cursor: pointer;
}

.messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px 12px 22px;
    display: flex;
    flex-direction: column;
    gap: 11px;
    scroll-behavior: smooth;
}

.day {
    text-align: center;
    font-size: 11px;
    color: #999;
    margin: 5px 0 10px;
}

.message-row {
    display: flex;
    align-items: flex-end;
    gap: 6px;
    max-width: 88%;
    animation: appear .2s ease-out;
}

.message-row.mine {
    align-self: flex-end;
    flex-direction: row-reverse;
}

@keyframes appear {
    from { opacity: 0; transform: translateY(7px); }
    to { opacity: 1; transform: translateY(0); }
}

.mini-avatar {
    width: 25px;
    height: 25px;
    border-radius: 50%;
    flex-shrink: 0;
    display: grid;
    place-items: center;
    color: white;
    font-size: 11px;
    font-weight: 700;
}

.message-content {
    display: flex;
    flex-direction: column;
    gap: 3px;
}

.sender {
    font-size: 11px;
    color: #888;
    margin-left: 9px;
}

.bubble {
    padding: 9px 13px;
    border-radius: 18px;
    font-size: 15px;
    line-height: 1.35;
    overflow-wrap: anywhere;
}

.theirs .bubble {
    background: #e9e9eb;
    color: #111;
    border-bottom-left-radius: 5px;
}

.mine .bubble {
    background: #1685ed;
    color: white;
    border-bottom-right-radius: 5px;
}

.typing {
    display: none;
    align-items: center;
    gap: 5px;
    margin-left: 31px;
    color: #888;
    font-size: 11px;
}

.typing.show { display: flex; }

.dots {
    display: flex;
    gap: 3px;
    background: #e9e9eb;
    padding: 9px 11px;
    border-radius: 15px;
}

.dots span {
    width: 5px;
    height: 5px;
    background: #999;
    border-radius: 50%;
    animation: bounce .8s infinite alternate;
}

.dots span:nth-child(2) { animation-delay: .2s; }
.dots span:nth-child(3) { animation-delay: .4s; }

@keyframes bounce {
    to { transform: translateY(-4px); }
}

.composer {
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 10px 12px;
    padding-bottom: max(12px, env(safe-area-inset-bottom));
    border-top: 1px solid #eee;
    background: #fafafa;
}

.plus {
    color: #1685ed;
    font-size: 27px;
    width: 28px;
    text-align: center;
}

.input-wrap {
    flex: 1;
    min-width: 0;
    border: 1px solid #d1d1d6;
    background: white;
    border-radius: 22px;
    padding: 0 13px;
    display: flex;
    align-items: center;
    min-height: 39px;
}

#messageInput {
    display: block;
    width: 100%;
    min-width: 0;
    height: 37px;
    border: 0;
    outline: none;
    background: transparent;
    color: #111;
    font-family: inherit;
    font-size: 16px;
    padding: 0;
    margin: 0;
    appearance: none;
    -webkit-appearance: none;
}

#messageInput::placeholder { color: #aaa; }

#sendButton {
    border: 0;
    background: #1685ed;
    color: white;
    border-radius: 50%;
    width: 34px;
    height: 34px;
    font-size: 17px;
    cursor: pointer;
    flex-shrink: 0;
}

#sendButton:active { opacity: .65; }

.notice {
    text-align: center;
    color: #aaa;
    font-size: 10px;
    padding: 4px;
}
</style>
</head>
<body>

<div class="app">
    <header class="header">
        <div class="back">‹</div>
        <div class="group">
            <div class="avatars">
                <div class="avatar" style="background:#e58b8b">J</div>
                <div class="avatar" style="background:#8b9ee5">M</div>
                <div class="avatar" style="background:#62aa91">A</div>
                <div class="avatar" style="background:#d69b54">S</div>
            </div>
            <div class="group-name">The Group Chat ▾</div>
            <div class="status" id="status">4 people</div>
        </div>
        <div class="info">ⓘ</div>
    </header>

    <main class="messages" id="messages">
        <div class="day">iMessage</div>
    </main>

    <div class="typing" id="typing">
        <div class="dots"><span></span><span></span><span></span></div>
        <span id="typingName">Someone is typing</span>
    </div>

    <div class="composer">
        <div class="plus">＋</div>
        <div class="input-wrap">
            <input
                id="messageInput"
                type="text"
                placeholder="iMessage"
                autocomplete="off"
                autocorrect="off"
                spellcheck="false"
            >
        </div>
        <button id="sendButton" type="button">↑</button>
    </div>
    <div class="notice">Group conversation · iMessage</div>
</div>

<script>
(function () {
    const messages = document.getElementById("messages");
    const input = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");
    const typing = document.getElementById("typing");
    const typingName = document.getElementById("typingName");
    const status = document.getElementById("status");

    const people = [
        { name: "Jake", initial: "J", color: "#e58b8b" },
        { name: "Mason", initial: "M", color: "#8b9ee5" },
        { name: "Alex", initial: "A", color: "#62aa91" },
        { name: "Sophie", initial: "S", color: "#d69b54" },
        { name: "Ethan", initial: "E", color: "#9b77c9" },
        { name: "Liam", initial: "L", color: "#559bb5" }
    ];

    const conversation = [
        ["Jake", "yo"],
        ["Mason", "what's everyone doing"],
        ["Alex", "nothing rn"],
        ["Sophie", "same 😭"],
        ["Ethan", "anyone on later?"],
        ["Jake", "probably"],
        ["Liam", "wait what are we playing"],
        ["Mason", "idk yet"],
        ["Alex", "someone pick"],
        ["Sophie", "I'm down for anything"],
        ["Ethan", "give me a minute"],
        ["Jake", "bro disappeared"],
        ["Liam", "💀"],
        ["Mason", "hello???"],
        ["Alex", "guys"],
        ["Sophie", "anyone there"],
        ["Jake", "ok"],
        ["Ethan", "......"]
    ];

    const extraMessages = [
        ["Mason", "wait"],
        ["Alex", "what"],
        ["Jake", "nvm"],
        ["Sophie", "😭"],
        ["Liam", "hello"],
        ["Ethan", "anybody?"],
        ["Mason", "guys"],
        ["Alex", "bruh"]
    ];

    let messageIndex = 0;
    let coughCount = 0;
    let runId = 0;
    let runTimers = [];
    let stopped = false;

    function addMessage(name, text, mine) {
        const person = people.find(p => p.name === name) || people[0];

        const row = document.createElement("div");
        row.className = "message-row " + (mine ? "mine" : "theirs");

        if (!mine) {
            const avatar = document.createElement("div");
            avatar.className = "mini-avatar";
            avatar.style.background = person.color;
            avatar.textContent = person.initial;
            row.appendChild(avatar);
        }

        const content = document.createElement("div");
        content.className = "message-content";

        if (!mine) {
            const sender = document.createElement("div");
            sender.className = "sender";
            sender.textContent = name;
            content.appendChild(sender);
        }

        const bubble = document.createElement("div");
        bubble.className = "bubble";
        bubble.textContent = text;
        content.appendChild(bubble);

        row.appendChild(content);
        messages.appendChild(row);
        messages.scrollTop = messages.scrollHeight;
    }

    function schedule(fn, delay, id) {
        const timer = setTimeout(() => {
            if (id === runId) fn();
        }, delay);
        runTimers.push(timer);
    }

    function stopTyping() {
        typing.classList.remove("show");
    }

    function startConversation() {
        runId++;
        const thisRun = runId;

        runTimers.forEach(clearTimeout);
        runTimers = [];
        stopped = false;
        messageIndex = 0;
        status.textContent = "Active now";

        const sequence = conversation.concat(extraMessages);
        let elapsed = 0;

        sequence.forEach((item, index) => {
            // Messages become less frequent as the conversation continues.
            const delay = index < 4 ? 450 :
                          index < 8 ? 650 :
                          index < 12 ? 850 :
                          index < 16 ? 1100 : 1400;

            elapsed += delay;

            if (elapsed > 9700) return;

            schedule(() => {
                if (thisRun !== runId || stopped) return;

                const person = item[0];
                typingName.textContent = person + " is typing";
                typing.classList.add("show");

                schedule(() => {
                    if (thisRun !== runId || stopped) return;
                    stopTyping();
                    addMessage(item[0], item[1], false);
                }, 300, thisRun);
            }, elapsed, thisRun);
        });

        schedule(() => {
            if (thisRun !== runId) return;
            stopped = true;
            stopTyping();
            status.textContent = "Active earlier";
        }, 10000, thisRun);
    }

    function sendMessage() {
        const value = input.value.trim();
        if (!value) return;

        addMessage("You", value, true);
        input.value = "";
        input.focus();

        if (value.toLowerCase() === "coughs") {
            coughCount++;

            if (coughCount >= 2) {
                coughCount = 0;
                status.textContent = "Everyone is back";
                startConversation();
            }
        } else {
            coughCount = 0;
        }
    }

    sendButton.addEventListener("click", sendMessage);

    input.addEventListener("keydown", function(event) {
        if (event.key === "Enter") {
            event.preventDefault();
            sendMessage();
        }
    });

    // Start the first conversation.
    startConversation();

    // Keep the input ready for typing.
    input.addEventListener("input", function() {
        sendButton.style.opacity = input.value.trim() ? "1" : ".75";
    });
})();
</script>

</body>
</html>
